services:
  - type: web
    name: emploicamer-api-preview
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: preview
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: emploicamer-preview-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_CLIENT_ID
        value: 45847298670-fakktka7o2vpe16uejg0g5onhebmpkas.apps.googleusercontent.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: emploicamer-preview-db
    databaseName: emploicamer_preview
    user: emploicamer_preview
    plan: free
    region: frankfurt